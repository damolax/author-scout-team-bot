name: Python and web build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot_main.py bot_main_v3.py
      - name: Import v3 overlay
        run: python -c "import bot_main_v3; print('Author Scout', bot_main_v3.app.version)"
      - name: Letterdesk import regression
        run: |
          python - <<'PY'
          from letterdesk_import import parse_upload
          csv_data = (
              "Original Row,Author,Recorded Email,Readiness / Hold,Subject,Author-language Message,English Review,Primary Research Source\n"
              "1,Author One,shared@example.com,READY,Subject One,Primary one,English one,https://example.com/a\n"
              "2,Author Two,shared@example.com,READY,Subject Two,Primary two,English two,https://example.com/b\n"
          ).encode("utf-8")
          parsed = parse_upload(csv_data, "letterdesk-real-headers.csv")
          assert len(parsed["rows"]) == 2, parsed
          assert parsed["rows"][0]["email"] == "shared@example.com"
          assert parsed["rows"][1]["email"] == "shared@example.com"
          print("Letterdesk regression rows:", len(parsed["rows"]))
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Build Vite dashboard
        run: npm run build
