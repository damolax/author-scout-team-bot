name: Python and web build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot_main.py bot_main_v3.py letterdesk_service_import.py letterdesk_import_plan.py letterdesk_import_commit.py letterdesk_import_api.py letterdesk_flow_engine.py letterdesk_flow_api.py letterdesk_gmail_api.py letterdesk_campaign_api.py letterdesk_campaign_delivery.py letterdesk_reply_rules.py letterdesk_reply_store.py letterdesk_reply_api.py letterdesk_gmail_reply_sync.py letterdesk_import_undo.py letterdesk_bulk_import.py letterdesk_bulk_api.py letterdesk_import_diff.py letterdesk_field_review_api.py letterdesk_language.py
      - name: Import v3 overlay
        run: python -c "import bot_main_v3; print('Author Scout', bot_main_v3.app.version)"
      - name: Letterdesk import regression
        run: |
          python - <<'PY'
          from letterdesk_import import parse_upload
          csv_data = (
              "Original Row,Author,Public recorded contact,Contact type,Routing caveat,Earlier work,Updated evidence / research finding,Strongest new source URL,Email source URL,Older book / bio source URL,Evidence tier,Research checked,Send gate,Message language,Personalized subject,Author-language first message,English review version,Evidence anchor / note,Pivotal question (English),Email compose link\n"
              "1,Author One,shared@example.com,Agency,,,Recent activity,https://example.com/a,https://example.com/contact,,,2026-10-11,READY,English,Subject One,Primary one,English one,,,\n"
              "2,Author Two,shared@example.com,Agency,,,Recent activity,https://example.com/b,https://example.com/contact,,,2026-10-11,READY,English,Subject Two,Primary two,English two,,,\n"
          ).encode("utf-8")
          parsed = parse_upload(csv_data, "letterdesk-real-headers.csv")
          assert len(parsed["rows"]) == 2, parsed
          assert parsed["rows"][0]["email"] == "shared@example.com"
          assert parsed["rows"][1]["email"] == "shared@example.com"
          print("Letterdesk regression rows:", len(parsed["rows"]))
          PY

      - name: Letter Desk Neon API authorization and isolation
        run: python -m unittest -v tests/test_letterdesk_v2_api.py
      - name: Letter Desk isolated-preview safety
        run: LETTERDESK_STAGING_ISOLATED=true LETTERDESK_V2_ENABLED=true python -m unittest -v tests/test_letterdesk_staging_guard.py
      - name: Letter Desk first-party login bridge safety
        run: python -m unittest -v tests/test_letterdesk_staging_auth.py
      - name: Letter Desk Phase 3 discovery rules
        run: python -m unittest -v tests/test_letterdesk_discovery.py
      - name: Letter Desk Phase 3 team and writer guard
        run: python -m unittest -v tests/test_letterdesk_scout_api.py
      - name: Letter Desk Phase 4 workbook parser and approval safety
        run: python -m unittest -v tests/test_letterdesk_service_import.py
      - name: Letter Desk Phase 4 upload API and isolation
        run: python -m unittest -v tests/test_letterdesk_import_api.py
      - name: Letter Desk Phase 5 flow graph rules
        run: python -m unittest -v tests/test_letterdesk_flow_engine.py
      - name: Letter Desk Phase 5 flow API permission gates
        run: python -m unittest -v tests/test_letterdesk_flow_api.py
      - name: Letter Desk Phase 6 Gmail OAuth and alias verification safety
        run: python -m unittest -v tests/test_letterdesk_gmail_api.py
      - name: Letter Desk Phase 6 campaign permissions and controls
        run: python -m unittest -v tests/test_letterdesk_campaign_api.py
      - name: Letter Desk Phase 6 live Gmail delivery kill switches
        run: python -m unittest -v tests/test_letterdesk_campaign_delivery.py
      - name: Letter Desk Phase 7 reply rules and Gmail known-thread safety
        run: python -m unittest -v tests/test_letterdesk_reply_rules.py
      - name: Letter Desk Phase 7 reply API team and write protection
        run: python -m unittest -v tests/test_letterdesk_reply_api.py
      - name: Letter Desk Phase 8 import undo, tamper gates and 500-row parsing
        run: python -m unittest -v tests/test_letterdesk_phase8_reliability.py
      - name: Letter Desk 50k streaming CSV and Excel regression
        run: python -m unittest -v tests/test_letterdesk_bulk_50k.py
      - name: Letter Desk 50k API signed-in isolation
        run: python -m unittest -v tests/test_letterdesk_bulk_api.py
      - name: Letter Desk redesign conflict and localization safeguards
        run: python -m unittest -v tests/test_letterdesk_redesign.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Check extension account routing
        run: |
          node --check ../extension/gmail.js
          node --check ../extension/worker.js
          node --test ../tests/test_extension.mjs ../tests/test_extension_worker.mjs
      - name: Letter Desk six-workspace imports and branching safety
        run: node --test src/letterdesk/letterdesk-contracts.test.js
      - name: Letter Desk Phase 8 persisted sign-in regression
        run: node --test src/letterdesk/session-policy.test.js
      - name: Letter Desk visual graph layout and cycle safety
        run: node --test src/letterdesk/flow-geometry.test.js
      - name: Build Vite dashboard
        run: npm run build
